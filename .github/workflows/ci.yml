name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.1"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        optimize:
          - Debug
          - ReleaseFast
          - ReleaseSafe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true
          cache-key: ${{ matrix.optimize }}

      - name: Show Zig version
        run: zig version

      - name: Install Vulkan SDK + Lavapipe (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_lavapipe: true
          install_runtime: true
          cache: true
          stripdown: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build project
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

      - name: Run all tests
        run: zig build test test-render -Doptimize=${{ matrix.optimize }} --summary all
